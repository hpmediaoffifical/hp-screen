[package]
name = "hp-screen"
version = "0.1.0"
description = "HP Screen - quay màn hình cho Windows 11"
authors = ["Nguyễn Hoàng Phụng (HP Media)"]
license = "MIT"
repository = "https://github.com/hpmediaoffifical/hp-screen"
edition = "2024"

[lib]
name = "hp_screen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hp-core = { path = "../crates/hp-core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = "2.0.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_DataExchange"] }
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3.7.0"
cpal = "0.18.2"
tauri-plugin-global-shortcut = "2"
trash = "5.3.0"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
base64 = "0.23.1"


# Capture-and-annotate: window frames for snapping the selection, and Windows' own offline
# text recognition (OCR). Kept apart from the list above so both can grow without conflicts.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections"] }
