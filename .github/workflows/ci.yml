name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests (pure logic, no desktop needed)
        run: cargo test --workspace

      - name: Frontend tests
        run: pnpm test

      - name: Frontend type check and build
        run: pnpm build

# Releases (installer + updater signature + latest.json) are built by release.yml on v* tags.
