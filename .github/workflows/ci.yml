name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Tesseract (the built-in Vietnamese text recognition) is linked statically into
      # hp-screen; vcpkg builds it, and its archive of built packages is cached.
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Localcpkgrchives
          key: vcpkg-archives-x64-windows-static-tesseract

      - name: Tesseract (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOTcpkg.exe" install "tesseract[core]:x64-windows-static"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Rust tests (pure logic, no desktop needed)
        run: cargo test --workspace

      - name: Frontend tests
        run: pnpm test

      - name: Frontend type check and build
        run: pnpm build

# Releases (installer + updater signature + latest.json) are built by release.yml on v* tags.
